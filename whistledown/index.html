<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lady Whistledown - M&J</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bridgerton-theme">

    <div class="whis-header animate__animated animate__fadeInDown">
        <h1>Lady Whistledown - Boda M&J</h1>
        <p>Querido y gentil lector. <br>Bienvenido al espacio para leer y comentar
            los mejores chismes y sucesos del casamiento de Mili y Juli.
        </p>
    </div>

    <div class="whis-container animate__animated animate__fadeInUp">

        <div class="gossip-form">
            <textarea id="inputChisme" class="gossip-textarea"
                placeholder="Escribe aquí tu secreto de forma totalmente anónima..."></textarea>
            <button class="btn-whis" onclick="enviarChisme()">Publicar Rumor</button>
            <p id="loader-whis">Enviando a la imprenta... 🪶</p>
        </div>

        <div id="gossip-feed" class="gossip-feed">
        </div>

    </div>

    <script src="assets/js/chismes.js"></script>
</body>

</html>
