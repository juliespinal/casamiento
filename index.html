<!DOCTYPE html>
<html lang="es">

</html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mili & Juli - Acceso</title>

    <link rel="icon" type="image/png" href="./confirmacion/assets/img/favicon.png" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <style>
        :root {
            --color-verde: #9A9B6A;
            --color-dorado: #D4B996;
            --color-rojo: #B55328;
            --color-texto: #444444;
            --color-blanco: #ffffff;
        }

        * {
            box-sizing: border-box;
            outline: none;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        .background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .background-layer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .content-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30vh;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.8rem;
            color: var(--color-dorado);
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            margin: 0;
            line-height: 1.1;
            text-align: center;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--color-blanco);
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            margin: 0 0 20px 0;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .access-box {
            background: rgba(214, 211, 211, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            width: 80%;
            max-width: 320px;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            margin-top: 10px;
            margin-bottom: 10px !important;
        }

        .instruction-text {
            color: #4e4e4e;
            font-size: 0.85rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .custom-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--color-dorado);
            border-radius: 50px;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            color: #333;
            background: rgba(255, 255, 255, 0.8);

            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            border-color: var(--color-verde);
            box-shadow: 0 0 0 3px rgba(154, 155, 106, 0.2);
        }

        .custom-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--color-verde);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: transform 0.2s;
        }

        .custom-btn:active {
            transform: scale(0.98);
        }

        .error-container {
            display: none;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
            color: var(--color-rojo);
            font-size: 0.8rem;
            font-weight: 700;
        }

        @media (max-height: 600px) {
            .content-layer {
                padding-top: 15vh;
            }

            h1 {
                font-size: 3rem;
            }

            h2 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>

    <div class="background-layer">
        <img src="./confirmacion/assets/img/DSC_0292a.jpg" alt="Fondo">
    </div>

    <div class="content-layer">

        <h1 class="animate__animated animate__fadeInDown">Mili & Juli</h1>
        <h2 class="animate__animated animate__fadeInDown">Bienvenidos</h2>

        <div class="access-box animate__animated animate__fadeInUp">
            <p class="instruction-text">
                Ingresá el <b>código de tu invitación</b> <em><br>(mirá tu tarjeta)</em>
            </p>

            <input type="text" id="codigoInput" class="custom-input" placeholder="CÓDIGO AQUÍ">

            <button onclick="validarCodigo()" class="custom-btn">INGRESAR</button>

            <div id="msjError" class="error-container">
                <i class="fas fa-exclamation-circle"></i>
                <span>Código incorrecto</span>
            </div>
        </div>

    </div>

    <script>
        const accesos = {
            "CORAZON": { precio: 0, texto: "Familia" },
            "INTIMOS": { precio: 0, texto: "Amigos/Familia" },
            "JULINDIS": { precio: 0, texto: "Amigos" },
            "MILINDIS": { precio: 0, texto: "Amigos" },
            "AMORE": { precio: 0, texto: "Amore" },
            "291123": { precio: 0, texto: "291123" },
            "PROMESA": { precio: 0, texto: "Promesa" },
            "DESTINO": { precio: 0, texto: "Destino" },
            "ETERNIDAD": { precio: 0, texto: "Eternidad" },
            "240225": { precio: 0, texto: "240225" },
            "ESCUELITA": { precio: 0, texto: "Escuelita" },
            "INFINITO": { precio: 0, texto: "Infinito" },
            "DRUMMER": { precio: 0, texto: "Fran Maggio" },
            "LABUBU": { precio: 0, texto: "Labubu" }
        };

        function validarCodigo() {
            const input = document.getElementById('codigoInput');
            const errorDiv = document.getElementById('msjError');
            const codigoIngresado = input.value.trim().toUpperCase();

            if (accesos[codigoIngresado]) {

                localStorage.setItem('boda_precio', accesos[codigoIngresado].precio);
                localStorage.setItem('boda_texto', accesos[codigoIngresado].texto);
                localStorage.setItem('boda_codigo', codigoIngresado);
                a
                const box = document.querySelector('.access-box');
                if (box) box.classList.add('animate__fadeOutDown');

                // Redirección
                setTimeout(() => {
                    window.location.href = "./confirmacion/";
                }, 500);

            } else {
                // Manejo de Error
                if (errorDiv) errorDiv.style.display = 'flex';

                input.classList.add('animate__animated', 'animate__shakeX');
                input.style.borderColor = "#B55328";

                setTimeout(() => {
                    input.classList.remove('animate__animated', 'animate__shakeX');
                }, 1000);
            }
        }

        document.getElementById("codigoInput").addEventListener("keypress", function (e) {
            if (e.key === "Enter") validarCodigo();
        });
    </script>
    <script>
        // FIX: Detecto si el usuario volvió con el botón "Atrás"
        window.addEventListener("pageshow", function (event) {
            // Si la página viene de la memoria caché (botón atrás)...
            var historyTraversal = event.persisted ||
                (typeof window.performance != "undefined" &&
                    window.performance.navigation.type === 2);
            if (historyTraversal) {
                // ... recargo la web para reiniciar animaciones y limpiar inputs
                window.location.reload();
            }
        });
    </script>
</body>

</html>
